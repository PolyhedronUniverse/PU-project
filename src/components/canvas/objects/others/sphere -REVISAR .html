<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Sphere</title>
		<meta charset="utf-8">
		<style type="text/css">

			body {
				background-color: #000000;
				margin: 0px;
				overflow: hidden;
			}

			a {
				color: #00AA80;
			}

			#top {
				position: absolute;
				top: 0px;
				width: 100%;
				padding: 10px;
				text-align: center;
			}

			#info {

				background-color: rgba(0,0,0,0.15);
				border-radius: 5px;
				padding: 5px;
				color: #ffffff;
				font-family: Monospace;
				font-size:13px;
				font-weight: bold;
				text-shadow: rgba(0,0,0,0.75) 1px 1px 0px;
			}


		</style>
	</head>
	<body>

		<script src="/js/ga.js"></script>

		<script type="text/javascript" src="js/ThreeWebGL.js"></script>
		<script type="text/javascript" src="js/ThreeExtras.js"></script>

		<script type="text/javascript" src="js/Detector.js"></script>
		<script type="text/javascript" src="js/RequestAnimationFrame.js"></script>

		<div id="container"></div>
		<div id="top"><span id="info"><u>Drop an image</u> from your desktop. Realtime version of most excellent <a href="http://vimeo.com/10008093" target="_blank">Tales of the Unexpected</a></span></div>

		<script id="vs" type="x-shader/x-vertex">

			uniform float offset_x;
			uniform float offset_y;
			uniform sampler2D map;

			varying vec2 vUv;

			void main() {

				vUv = ( uv / 3.0 ) + vec2( offset_x, offset_y );
				vUv.x = mod( vUv.x, 1.0 );
				vUv.y = mod( vUv.y, 1.0 );

				vec4 color = texture2D( map, vUv );
				float dist = ( color.r + color.g + color.b ) / 3.0;

				vec4 pos = vec4( position + position * dist, 1.0 );

				gl_Position = projectionMatrix * modelViewMatrix * pos;

			}

		</script>

		<script id="fs" type="x-shader/x-fragment">

			uniform sampler2D map;

			varying vec2 vUv;

			void main() {

				gl_FragColor = texture2D( map, vUv );

			}

		</script>

		<script type="text/javascript">

			var container, stats;
			var camera, scene, renderer, canvas, context, texture;

			var mouseX = 0, mouseY = 0;
			var start_time = new Date().getTime();

			var windowHalfX = window.innerWidth / 2;
			var windowHalfY = window.innerHeight / 2;

			init();
			animate();

			function init() {

				container = document.getElementById( 'container' );

				camera = new THREE.Camera( 30, window.innerWidth / window.innerHeight, 1, 5000 );
				camera.position.z = 1000;

				scene = new THREE.Scene();

				canvas = document.createElement( 'canvas' );
				canvas.width = 2048;
				canvas.height = 2048;

				context = canvas.getContext( '2d' );

				texture = new THREE.Texture( canvas );
				texture.magFilter = THREE.LinearMipMapLinearFilter;
				texture.minFilter = THREE.LinearMipMapLinearFilter;

				loadImage( 'texture.jpg' );

				material = new THREE.MeshShaderMaterial( {

					uniforms: {

						"map": { type: "t", value: 0, texture: texture },
						"offset_x": { type: "f", value: 0 },
						"offset_y": { type: "f", value: 0 }

					},
					vertexShader: document.getElementById( 'vs' ).textContent,
					fragmentShader: document.getElementById( 'fs' ).textContent

				} );

				mesh = new THREE.Mesh( new Sphere( 150, 300, 200 ), material );
				mesh.doubleSided = true;
				scene.addObject( mesh );

				renderer = new THREE.WebGLRenderer( { antialias: false } );
				renderer.setSize( window.innerWidth, window.innerHeight );
				container.appendChild( renderer.domElement );

				/*
				stats = new Stats();
				stats.domElement.style.position = 'absolute';
				stats.domElement.style.top = '0px';
				container.appendChild( stats.domElement );
				*/

				document.addEventListener( 'mousemove', onDocumentMouseMove, false );
				window.addEventListener( 'resize', onWindowResize, false );

				document.addEventListener( 'dragover', onDocumentDragOver, false );
				document.addEventListener( 'dragleave', onDocumentLeave, false );
				document.addEventListener( 'drop', onDocumentDrop, false );


			}

			function onDocumentMouseMove( event ) {

				mouseX = ( event.clientX - windowHalfX );
				mouseY = ( event.clientY - windowHalfY );

			}

			function onWindowResize( event ) {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onDocumentDragOver( event ) {

				event.preventDefault();

			}

			function onDocumentLeave( event ) {

				event.preventDefault();

			}

			function loadImage( src ) {

				var image = document.createElement( 'img' );

				image.onload = function () {

					context.drawImage( this, 0, 0, 2048, 2048 );
					texture.needsUpdate = true;

				};

				image.src = src;

			}

			function onDocumentDrop( event ) {

				event.preventDefault();

				var file = event.dataTransfer.files[ 0 ];
				var reader = new FileReader();

				reader.onload = function ( event ) {

					loadImage( event.target.result );

				};

				reader.readAsDataURL( file );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				render();

			}

			function render() {

				material.uniforms.offset_x.value -= mouseX * 0.000015;
				material.uniforms.offset_y.value -= mouseY * 0.000015;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
